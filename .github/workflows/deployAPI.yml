name: Deploy on Main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v3

      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      
      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{secrets.USER_VM}}@${{secrets.IP_VM}} "\
            cd /var/www/ESP-API || git clone https://github.com/EdgarCegepRDL/ESP-H26-Edgar.git /var/www/ESP-API; \
            cd /var/www/ESP-API; \
            git fetch origin main; \
            git reset --hard origin/main"
